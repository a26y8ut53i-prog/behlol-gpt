<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a12"><title>بهلول GPT</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar"><div class="brand"><div class="brand-icon">ب</div><div><strong>بهلول GPT</strong><small>دستیار هوشمند فارسی</small></div></div><span class="status"><i></i> دستیار هوشمند</span></header>
<main>
<section class="hero" id="hero"><div class="avatar">ب</div><div class="eyebrow">هوشمندی با چاشنی خرد</div><h1>سلام، بهلول اینجاست!</h1><p>سؤالت را بپرس؛ از نوشتن و یادگیری تا بررسی تصاویر.</p><div class="suggestions"><button type="button" data-prompt="خودت را معرفی کن">معرفی بهلول</button><button type="button" data-prompt="برای یادگیری زبان انگلیسی یک برنامه بده">یادگیری زبان</button><button type="button" data-prompt="یک ایده خلاقانه برای کسب‌وکار بده">ایده‌های خلاقانه</button></div></section>
<section id="chat" class="chat" aria-live="polite"></section>
<form id="chatForm" class="composer"><div id="imagePreview" class="image-preview"></div><textarea id="message" rows="1" placeholder="پیامت را برای بهلول بنویس..." aria-label="متن پیام"></textarea><div class="composer-actions"><label class="icon-button" title="انتخاب تصویر"><span>＋</span><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><button id="voiceButton" type="button" class="icon-button" title="ورودی صوتی">🎙️</button><button id="sendButton" type="submit" class="send-button">ارسال ↑</button></div><div class="disclaimer">پاسخ‌های هوش مصنوعی ممکن است اشتباه باشند.</div></form>
</main><script src="/app.js"></script></body></html>
